aid: can-capital
name: Can Capital
description: >-
  CAN Capital is a small business financing company that provides short-term
  working capital loans, equipment financing, and ecommerce loans to small
  business owners across the United States. One of the earliest alternative
  small-business lenders, the company has facilitated more than 190,000 funding
  transactions totaling over $8 billion in working capital, underwriting on
  business performance and daily/weekly revenue rather than traditional credit
  criteria. Borrowers apply online, receive fast funding decisions, and manage
  their accounts through a self-service client portal. Surfaced as a portfolio
  company of Accel and profiled in the API Evangelist network; CAN Capital
  publishes a marketing site, application flow, and customer portal but no
  public developer API or discovery surface at this time.
